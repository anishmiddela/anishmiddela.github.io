# Automatically builds and deploys the site to GitHub Pages on every push to main.
# You don't need to run "npm run build" manually — this does it for you in the cloud.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VITE_GC_TOKEN is stored as a GitHub secret — go to repo Settings → Secrets → Actions to add it
      - run: npm run build
        env:
          VITE_GC_TOKEN: ${{ secrets.VITE_GC_TOKEN }}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
